<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Nhập liệu cây trồng</title>
<style>
:root{--bg:#f6f7f3;--card:#fff;--tx:#1d2a1f;--mut:#667366;--pri:#2f7d3a;--pri-tx:#fff;--bd:#dde3d8;--dng:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121712;--card:#1c241d;--tx:#e8efe6;--mut:#9aa89a;--pri:#5fb86b;--pri-tx:#0c1a0e;--bd:#2c382d;--dng:#f2867f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--pri);color:var(--pri-tx);font-weight:600}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.sm{padding:7px 11px;font-size:14px}
button.ghost{background:none;color:var(--dng);padding:6px 8px;font-weight:500}
.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.fr{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:0}.ck input{width:auto}
.ra{display:flex;gap:8px;align-items:center}
.hint{font-size:13px;color:var(--mut);margin:0 0 10px}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#msg.on{opacity:1}
</style>
</head>
<body>
<main>
<h1><span>🌱 Nhập liệu cây trồng</span><button id="cfg" class="sec sm">⚙ Trường dữ liệu</button></h1>

<section class="card" id="cfgp" hidden>
 <div class="head"><b>Tùy chỉnh trường dữ liệu</b><button id="cfgx" class="sec sm">Đóng</button></div>
 <p class="hint">Sửa tên, đổi kiểu, sắp xếp hoặc thêm/xóa trường. Thay đổi được lưu ngay. Dữ liệu cũ không bị mất khi đổi tên hoặc đổi kiểu.</p>
 <div id="cl"></div>
 <div class="row"><button id="add">+ Thêm trường</button><button id="rst" class="sec">Về mặc định</button></div>
</section>

<form class="card" onsubmit="return false">
 <div class="grid" id="fg"></div>
 <div class="row"><button id="save">Lưu bản ghi</button><button class="sec" id="cancel" style="display:none">Hủy sửa</button></div>
</form>

<section class="card">
 <div class="head"><b id="count"></b><button id="exp" class="sec">Xuất Excel</button></div>
 <div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
 <div class="row"><button class="ghost" id="clr">Xóa toàn bộ</button></div>
</section>
</main>
<div id="msg"></div>
<script>
(function(){
var KEY="cropdata_v1",SK="cropschema_v1",rows=[],S=[],editing=-1;
var TYPES=[["text","Chữ"],["number","Số"],["date","Ngày"],["select","Chọn từ danh sách"],["long","Ghi chú dài"]];
var DEF=[
{id:"ngay",name:"Ngày đo",type:"date",keep:1},
{id:"loai",name:"Loại cây",type:"text",keep:1},
{id:"lo",name:"Lô / Công thức",type:"text",keep:1},
{id:"ma",name:"Mã cây",type:"text"},
{id:"cao",name:"Chiều cao (cm)",type:"number"},
{id:"la",name:"Số lá",type:"number"},
{id:"dk",name:"Đường kính (mm)",type:"number"},
{id:"gd",name:"Giai đoạn",type:"select",opts:"Cây con,Sinh trưởng,Ra hoa,Đậu quả,Thu hoạch",keep:1},
{id:"gc",name:"Ghi chú",type:"long"}];
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function toast(t){var m=$("msg");m.textContent=t;m.className="on";setTimeout(function(){m.className=""},2200)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Không lưu được vào bộ nhớ")}}
function load(){
 try{rows=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){rows=[]}
 try{S=JSON.parse(localStorage.getItem(SK)||"null")}catch(e){S=null}
 if(!Array.isArray(S)||!S.length)S=JSON.parse(JSON.stringify(DEF));
}
function opts(f){return String(f.opts||"").split(",").map(function(s){return s.trim()}).filter(Boolean)}

function renderForm(v){
 v=v||{};
 $("fg").innerHTML=S.map(function(f){
  var x=v[f.id]||(f.type==="date"?today():""),id="x_"+f.id,h,w="";
  if(f.type==="select"){
   var o=opts(f);if(x&&o.indexOf(x)<0)o.push(x);
   h='<select id="'+id+'"><option value=""></option>'+o.map(function(t){return '<option'+(t===x?" selected":"")+'>'+esc(t)+'</option>'}).join("")+'</select>';
  }else if(f.type==="long"){h='<textarea id="'+id+'" rows="2">'+esc(x)+'</textarea>';w="full"}
  else h='<input id="'+id+'" type="'+(f.type==="number"?"number":f.type==="date"?"date":"text")+'"'+(f.type==="number"?' inputmode="decimal" step="any"':' autocomplete="off"')+' value="'+esc(x)+'">';
  return '<div class="'+w+'"><label>'+esc(f.name)+'</label>'+h+'</div>';
 }).join("");
}
function collect(){var o={};S.forEach(function(f){var e=$("x_"+f.id);o[f.id]=e?String(e.value).trim():""});return o}

function render(){
 $("count").textContent="Bản ghi ("+rows.length+")";
 $("th").innerHTML="<tr>"+S.map(function(f){return "<th>"+esc(f.name)+"</th>"}).join("")+"<th></th></tr>";
 if(!rows.length){$("tb").innerHTML='<tr><td colspan="'+(S.length+1)+'" class="empty">Chưa có dữ liệu</td></tr>';return}
 $("tb").innerHTML=rows.map(function(r,i){
  return "<tr>"+S.map(function(f){return "<td>"+esc(r[f.id])+"</td>"}).join("")+'<td style="white-space:nowrap"><button class="ghost" style="color:var(--pri)" data-e="'+i+'">Sửa</button><button class="ghost" data-d="'+i+'">Xóa</button></td></tr>';
 }).reverse().join("");
}
function endEdit(v){editing=-1;$("cancel").style.display="none";$("save").textContent="Lưu bản ghi";renderForm(v)}

$("save").onclick=function(){
 var o=collect();
 if(!S.some(function(f){return f.type!=="date"&&o[f.id]})){toast("Hãy nhập ít nhất một giá trị");return}
 if(editing>=0){rows[editing]=Object.assign({},rows[editing],o);toast("Đã cập nhật")}else{rows.push(o);toast("Đã lưu")}
 store(KEY,rows);render();
 var k={};S.forEach(function(f){if(f.keep)k[f.id]=o[f.id]});endEdit(k);
};
$("cancel").onclick=function(){endEdit()};
$("tb").onclick=function(e){
 var t=e.target,a=t.getAttribute("data-e"),d=t.getAttribute("data-d");
 if(a!==null){editing=+a;renderForm(rows[editing]);$("cancel").style.display="";$("save").textContent="Cập nhật";window.scrollTo({top:0,behavior:"smooth"})}
 else if(d!==null&&confirm("Xóa bản ghi này?")){rows.splice(+d,1);store(KEY,rows);render();endEdit(collect())}
};
$("clr").onclick=function(){if(rows.length&&confirm("Xóa toàn bộ "+rows.length+" bản ghi? Hãy xuất Excel trước nếu cần giữ.")){rows=[];store(KEY,rows);render()}};

/* ---- Tùy chỉnh trường ---- */
function renderCfg(){
 $("cl").innerHTML=S.map(function(f,i){
  return '<div class="fr" data-i="'+i+'"><input data-k="name" value="'+esc(f.name)+'">'+
  '<select data-k="type">'+TYPES.map(function(t){return '<option value="'+t[0]+'"'+(f.type===t[0]?" selected":"")+'>'+t[1]+'</option>'}).join("")+'</select>'+
  (f.type==="select"?'<input data-k="opts" placeholder="Các lựa chọn, cách nhau bằng dấu phẩy" value="'+esc(f.opts||"")+'">':"")+
  '<label class="ck"><input type="checkbox" data-k="keep"'+(f.keep?" checked":"")+'> Giữ giá trị sau khi lưu (tiện khi nhập nhiều cây cùng lô)</label>'+
  '<div class="ra"><button class="sec sm" data-a="up">↑</button><button class="sec sm" data-a="dn">↓</button><button class="ghost" data-a="del">Xóa trường</button></div></div>';
 }).join("");
}
function applyCfg(){store(SK,S);renderCfg();renderForm(collect());render()}
$("cfg").onclick=function(){$("cfgp").hidden=false;renderCfg();$("cfgp").scrollIntoView({behavior:"smooth"})};
$("cfgx").onclick=function(){$("cfgp").hidden=true};
$("cl").onchange=function(e){
 var t=e.target,r=t.closest(".fr"),k=t.getAttribute("data-k");if(!r||!k)return;
 var f=S[+r.getAttribute("data-i")];
 f[k]=k==="keep"?(t.checked?1:0):t.value;
 if(k==="name"&&!String(f.name).trim())f.name="Trường";
 if(k==="type"||k==="opts"||k==="name"){store(SK,S);if(k==="type")renderCfg();renderForm(collect());render()}else store(SK,S);
};
$("cl").onclick=function(e){
 var a=e.target.getAttribute("data-a");if(!a)return;
 var i=+e.target.closest(".fr").getAttribute("data-i"),tmp;
 if(a==="up"&&i>0){tmp=S[i-1];S[i-1]=S[i];S[i]=tmp}
 else if(a==="dn"&&i<S.length-1){tmp=S[i+1];S[i+1]=S[i];S[i]=tmp}
 else if(a==="del"){
  if(S.length<2){toast("Cần giữ ít nhất 1 trường");return}
  if(!confirm('Xóa trường "'+S[i].name+'"? Dữ liệu cũ của trường này sẽ không hiển thị và không xuất Excel nữa.'))return;
  S.splice(i,1);
 }
 applyCfg();
};
$("add").onclick=function(){S.push({id:"f"+Date.now().toString(36),name:"Trường mới",type:"text"});applyCfg()};
$("rst").onclick=function(){if(confirm("Đưa danh sách trường về mặc định? Dữ liệu đã nhập không bị xóa.")){S=JSON.parse(JSON.stringify(DEF));applyCfg()}};

/* ---- Trình tạo .xlsx tự viết (không cần thư viện, chạy offline) ---- */
var CT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
 var enc=new TextEncoder(),parts=[],cen=[],off=0;
 files.forEach(function(f){
  var nm=enc.encode(f[0]),d=enc.encode(f[1]),c=crc(d);
  var h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);
  h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,d);
  var g=new DataView(new ArrayBuffer(46));
  g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);
  g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nm.length,true);g.setUint32(42,off,true);
  cen.push(new Uint8Array(g.buffer),nm);
  off+=30+nm.length+d.length;
 });
 var cs=0;cen.forEach(function(x){cs+=x.length});
 var e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xe(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"")}
function colL(n){var s="";n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function xlsx(){
 var data=[S.map(function(f){return f.name})].concat(rows.map(function(r){return S.map(function(f){return r[f.id]})}));
 var sd=data.map(function(row,ri){return '<row r="'+(ri+1)+'">'+row.map(function(v,ci){
  var f=S[ci],ref=colL(ci)+(ri+1);
  if(ri>0&&f.type==="number"&&v!==""&&v!=null&&!isNaN(v))return '<c r="'+ref+'"><v>'+Number(v)+'</v></c>';
  return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v==null?"":v)+'</t></is></c>'}).join("")+'</row>'}).join("");
 var cols='<cols>'+S.map(function(f,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(f.type==="long"?30:16)+'" customWidth="1"/>'}).join("")+'</cols>';
 var X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
 return zip([
  ["[Content_Types].xml",X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
  ["_rels/.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
  ["xl/workbook.xml",X+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="DuLieuCayTrong" sheetId="1" r:id="rId1"/></sheets></workbook>'],
  ["xl/_rels/workbook.xml.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
  ["xl/worksheets/sheet1.xml",X+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+cols+'<sheetData>'+sd+'</sheetData></worksheet>']
 ]);
}
$("exp").onclick=function(){
 if(!rows.length){toast("Chưa có dữ liệu để xuất");return}
 var b=xlsx(),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="du-lieu-cay-trong-"+today()+".xlsx";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(a.href)},4000);toast("Đã xuất Excel");
};
load();renderForm();render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
